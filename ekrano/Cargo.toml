[package]
name = "ekrano"
version.workspace = true
description = "A GPU compute-centric 2D renderer (ekrano fork of Vello)."
categories = ["rendering", "graphics"]
keywords = ["2d", "vector-graphics"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
# There are no platform specific docs.
default-target = "x86_64-unknown-linux-gnu"
targets = []

[features]
default = ["goldy-default"]
# Mirrors `goldy` default backends for local dev; CI can pass `--no-default-features -F goldy-dx12-only`.
goldy-default = ["goldy/vulkan", "goldy/dx12", "goldy/metal", "goldy/instrumentation"]
goldy-dx12-only = ["goldy/dx12"]
# Enables GPU memory usage estimation. This performs additional computations
# in order to estimate the minimum required allocations for buffers backing
# bump-allocated GPU memory.
# TODO: Turn this into a runtime option used at resolve time and remove the feature.
bump_estimate = ["ekrano_encoding/bump_estimate"]

# Development only features

# Enables debug features when using the "async" pipeline.
debug_layers = []
# Reserved for future Slang hot-reload support (no effect today).
hot_reload = []
# Tracy profiler integration (forwarded to goldy).
tracy = ["goldy/tracy"]

[lints]
workspace = true

[dependencies]
ekrano_encoding = { workspace = true }
ekrano_shaders = { workspace = true }
bytemuck = { workspace = true }
skrifa = { workspace = true, features = ["std"] }
peniko = { workspace = true, default-features = true }
log = { workspace = true }
static_assertions = { workspace = true }
thiserror = { workspace = true }
# TODO: Add feature for built-in bitmap emoji support?
png = { workspace = true }
goldy = { path = "../../goldy", default-features = false }
