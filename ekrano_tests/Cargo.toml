[package]
name = "ekrano_tests"
description = "Integration tests for Ekrano."
categories = ["rendering", "graphics"]
keywords = ["2d", "vector-graphics"]
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ekrano = { path = "../ekrano" }
goldy = { path = "../../goldy" }
anyhow = { workspace = true }

pollster = { workspace = true }
png = { workspace = true }
nv-flip = "0.1.2"
image = { workspace = true, features = ["png"] }

scenes = { workspace = true }
oxipng = { workspace = true, features = ["freestanding", "parallel"] }

# Used by integration test binaries (tests/filters.rs, tests/blend_modes.rs) but
# not by src/lib.rs; listed as a dev-dependency to avoid the
# `unused_crate_dependencies` lint on the library compilation unit.
[dev-dependencies]
ekrano_encoding = { workspace = true }
