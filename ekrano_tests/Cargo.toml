[package]
name = "ekrano_tests"
description = "Integration tests for Ekrano."
categories = ["rendering", "graphics"]
keywords = ["2d", "vector-graphics"]
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["goldy-default"]
goldy-default = [
    "ekrano/goldy-default",
    "scenes/goldy-default",
    "goldy/vulkan",
    "goldy/dx12",
    "goldy/metal",
    "goldy/instrumentation",
]
goldy-dx12-only = ["ekrano/goldy-dx12-only", "scenes/goldy-dx12-only", "goldy/dx12"]
goldy-cuda = [
    "ekrano/goldy-cuda",
    "scenes/goldy-cuda",
    "goldy/cuda",
    "goldy/dx12",
    "goldy/instrumentation",
]

[lints]
workspace = true

[dependencies]
ekrano = { path = "../ekrano", default-features = false }
goldy = { path = "../../goldy", default-features = false }
anyhow = { workspace = true }

pollster = { workspace = true }
png = { workspace = true }
nv-flip = "0.1.2"
image = { workspace = true, features = ["png"] }

scenes = { path = "../examples/scenes", default-features = false }
oxipng = { workspace = true, features = ["freestanding", "parallel"] }
env_logger = { workspace = true }
log = { workspace = true }

# Used by integration test binaries (tests/filters.rs, tests/blend_modes.rs) but
# not by src/lib.rs; listed as a dev-dependency to avoid the
# `unused_crate_dependencies` lint on the library compilation unit.
[dev-dependencies]
ekrano_encoding = { workspace = true }
libtest-mimic = "0.8"

[[test]]
name = "blend_modes"
harness = false

[[test]]
name = "emoji"
harness = false

[[test]]
name = "filters"
harness = false

[[test]]
name = "heap_self_regulation"
harness = false

[[test]]
name = "hinting"
harness = false

[[test]]
name = "known_issues"
harness = false

[[test]]
name = "pipelined_memory"
harness = false

[[test]]
name = "property"
harness = false

[[test]]
name = "regression"
harness = false

[[test]]
name = "render_target_formats"
harness = false

[[test]]
name = "smoke_snapshots"
harness = false

[[test]]
name = "snapshot_test_scenes"
harness = false
