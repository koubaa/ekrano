[workspace]
resolver = "2"
members = [
    "ekrano",
    "ekrano_encoding",
    "ekrano_shaders",
    "ekrano_tests",
    "xtask",

    "examples/headless",
    "examples/scenes",
]

[workspace.package]
# Ekrano version, also used by ekrano_encoding and ekrano_shaders which mimic it.
#
# NOTE: When bumping this, remember to also bump those packages'
#       version in the dependencies section at the bottom of this file.
#
version = "0.7.0"

edition = "2024"
# Keep in sync with RUST_MIN_VER in .github/workflows/ci.yml, with the relevant README.md files
# and with the MSRV in the `Unreleased` section of CHANGELOG.md.
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/kob3/ekrano"

[workspace.lints]
# LINEBENDER LINT SET - Cargo.toml - v7
# See https://linebender.org/wiki/canonical-lints/
rust.keyword_idents_2024 = "forbid"
rust.non_ascii_idents = "forbid"
rust.non_local_definitions = "forbid"
rust.unsafe_op_in_unsafe_fn = "forbid"

rust.elided_lifetimes_in_paths = "warn"
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.trivial_numeric_casts = "warn"
rust.unnameable_types = "warn"
rust.unreachable_pub = "warn"
rust.unused_import_braces = "warn"
rust.unused_lifetimes = "warn"
rust.unused_macro_rules = "warn"
rust.unused_qualifications = "warn"

clippy.too_many_arguments = "allow"

clippy.allow_attributes_without_reason = "warn"
clippy.cast_possible_truncation = "warn"
clippy.collection_is_never_read = "warn"
clippy.default_trait_access = "warn"
clippy.dbg_macro = "warn"
clippy.debug_assert_with_mut_call = "warn"
clippy.doc_markdown = "warn"
clippy.fn_to_numeric_cast_any = "warn"
clippy.infinite_loop = "warn"
clippy.large_stack_arrays = "warn"
clippy.mismatching_type_param_order = "warn"
clippy.missing_assert_message = "warn"
clippy.missing_fields_in_debug = "warn"
clippy.same_functions_in_if_condition = "warn"
clippy.semicolon_if_nothing_returned = "warn"
clippy.should_panic_without_expect = "warn"
clippy.todo = "warn"
clippy.unseparated_literal_suffix = "warn"
clippy.use_self = "warn"

clippy.cargo_common_metadata = "warn"
clippy.negative_feature_names = "warn"
clippy.redundant_feature_names = "warn"
clippy.wildcard_dependencies = "warn"
# END LINEBENDER LINT SET

[workspace.dependencies]
ekrano = { version = "0.7.0", path = "ekrano" }
ekrano_encoding = { version = "0.7.0", path = "ekrano_encoding" }
ekrano_shaders = { version = "0.7.0", path = "ekrano_shaders" }
bytemuck = { version = "1.24.0", features = ["derive"] }
skrifa = { version = "0.40.0", default-features = false, features = ["autohint_shaping"] }
# The version of kurbo used below should be kept in sync
# with the version of kurbo used by peniko.
peniko = { version = "0.6.0", default-features = false }
# FIXME: This can be removed once peniko supports the schemars feature.
kurbo = { version = "0.13.0", default-features = false }
futures-intrusive = "0.5.0"
hashbrown = { version = "0.16.1", default-features = false, features = ["default-hasher"] }
smallvec = "1.15.1"
static_assertions = "1.1.0"
thiserror = { version = "2.0.17", default-features = false }
oxipng = { version = "9.1.5", default-features = false }
png = "0.17.16"
rayon = { version = "1.11.0" }
thread_local = "1.1.9"
crossbeam-channel = "0.5.15"
ordered-channel = { version = "1.2.0", features = ["crossbeam-channel"] }

# NOTE: The wgpu and naga versions should be kept in sync, and make sure to keep this
# in sync with the version badge in README.md and ekrano/README.md
wgpu = { version = "27.0.1", default-features = false, features = ["std", "wgsl"] }
naga = { version = "27.0.3", default-features = false }
log = "0.4.29"
image = { version = "0.25.9", default-features = false }

# Used for examples
clap = "4.5.54"
anyhow = "1.0.100"
pollster = "0.4.0"
wgpu-profiler = "0.25.0"
scenes = { path = "examples/scenes" }
svg = "0.18.0"
criterion = { version = "0.5.1", default-features = false }
rand = { version = "0.9.2", default-features = false, features = ["std_rng"] }
usvg = { version = "0.45.1" }
once_cell = "1.21.3"
console_error_panic_hook = "0.1.7"
console_log = "1.0"

# Used for testing
proc-macro2 = "1.0.105"
syn = { version = "2.0.114", features = ["full", "extra-traits"] }
quote = "1.0.43"
serde = { version = "1.0.228", default-features = false }
serde_json = "1.0.149"

[profile.instrument]
inherits = "release"
debug = true
strip = "none"
