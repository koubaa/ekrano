env:
  # We aim to always test with the latest stable Rust toolchain, however we pin to a specific
  # version like 1.70. Note that we only specify MAJOR.MINOR and not PATCH so that bugfixes still
  # come automatically. If the version specified here is no longer the latest stable version,
  # then please feel free to submit a PR that adjusts it along with the potential clippy fixes.
  RUST_STABLE_VER: "1.95" # In quotes because otherwise (e.g.) 1.70 would be interpreted as 1.7
  # The purpose of checking with the minimum supported Rust toolchain is to detect its staleness.
  # If the compilation fails, then the version specified here needs to be bumped up to reality.
  # Be sure to also update the rust-version property in the workspace Cargo.toml file,
  # plus all the README.md files of the affected packages.
  RUST_MIN_VER: "1.92"
  # List of packages that will be checked with the minimum supported Rust version.
  # This should be limited to packages that are intended for publishing.
  RUST_MIN_VER_PKGS: "-p ekrano -p ekrano_encoding -p ekrano_shaders"
  # The files stored in LFS the tests need to access, in JSON format
  LFS_FILES: '["ekrano_tests/snapshots/*.png"]'
  # Goldy is an external path dependency (sibling repo). CI clones it at this branch.
  # Pinned to PixelExchange until koubaa/goldy#305 lands; then revert to main.
  GOLDY_BRANCH: "cursor/pixel-exchange-08eb"
  GOLDY_REPO: "https://github.com/koubaa/goldy.git"
  # Redistributable WARP via NuGet (Microsoft.Direct3D.WARP). Dropped next to the
  # test binaries on Windows CI to override the older OS-provided d3d10warp.dll
  # that ships with windows-latest runners. Needed because ekrano snapshot tests
  # (e.g. snapshot_many_clips) fail on the stock runner WARP but pass on the
  # NuGet version, which carries several codegen/clipping fixes.
  # https://www.nuget.org/packages/Microsoft.Direct3D.WARP
  WARP_NUGET_VERSION: "1.0.18"


# Rationale
#
# We don't run clippy with --all-targets because then even --lib and --bins are compiled with
# dev dependencies enabled, which does not match how they would be compiled by users.
# A dev dependency might enable a feature that we need for a regular dependency,
# and checking with --all-targets would not find our feature requirements lacking.
# This problem still applies to cargo resolver version 2.
# Thus we split all the targets into two steps, one with --lib --bins
# and another with --tests --benches --examples.
# Also, we can't give --lib --bins explicitly because then cargo will error on binary-only packages.
# Luckily the default behavior of cargo with no explicit targets is the same but without the error.
#
# We use cargo-hack for a similar reason. Cargo's --workspace will do feature unification across
# the whole workspace. While cargo-hack will instead check each workspace package separately.
#
# Using cargo-hack also allows us to more easily test the feature matrix of our packages.
# We use --each-feature & --optional-deps which will run a separate check for every feature.
#
# GPU tests use idiomatic `cargo test` (one process per test binary) so lib/integration suites
# can share a process-lifetime Device and serialize only on DX12 WARP. cargo-nextest runs each
# test in its own process, which defeats that model.
#
# The MSRV jobs run only cargo check because different clippy versions can disagree on goals and
# running tests introduces dev dependencies which may require a higher MSRV than the bare package.
#
# For no_std checks we target x86_64-unknown-none, because this target doesn't support std
# and as such will error out if our dependency tree accidentally tries to use std.
# https://doc.rust-lang.org/stable/rustc/platform-support/x86_64-unknown-none.html
#
# We don't save caches in the merge-group cases, because those caches will never be re-used (apart
# from the very rare cases where there are multiple PRs in the merge queue).
# This is because GitHub doesn't share caches between merge queues and the main branch.

name: CI

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  # We run on push, even though the commit is the same as when we ran in merge_group.
  # This allows the cache to be primed.
  # See https://github.com/orgs/community/discussions/66430
  push:
    branches:
      - main

jobs:
  fmt:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone goldy
        run: git clone --depth 1 --branch ${{ env.GOLDY_BRANCH }} ${{ env.GOLDY_REPO }} ../goldy

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          components: rustfmt

      - name: cargo fmt
        # Use explicit package list instead of --all, which would also check
        # local path dependencies (goldy) outside this workspace.
        run: cargo fmt -p ekrano -p ekrano_encoding -p ekrano_shaders -p ekrano_tests -p xtask -p headless -p scenes --check

      - name: Install Taplo
        uses: uncenter/setup-taplo@09968a8ae38d66ddd3d23802c44bf6122d7aa991 # v1
        with:
          version: "0.9.3"

      - name: Run taplo fmt
        run: taplo fmt --check --diff

      - name: install ripgrep
        run: |
          sudo apt update
          sudo apt install ripgrep

      - name: check copyright headers
        run: bash .github/copyright.sh

  clippy-stable:
    name: cargo clippy
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Clone goldy
        run: git clone --depth 1 --branch ${{ env.GOLDY_BRANCH }} ${{ env.GOLDY_REPO }} ../goldy

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          components: clippy

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: cargo clippy
        run: cargo clippy --workspace --locked --all-features -- -D warnings

      - name: cargo clippy (auxiliary)
        run: cargo clippy --workspace --locked --all-features --tests --benches --examples -- -D warnings

  prime-lfs-cache:
    name: Prime LFS Cache
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      lfs-hash: ${{ steps.calc-hash.outputs.result }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - id: calc-hash
      name: Calculate LFS hash
      # GitHub's expression context doesn't support either a literal newline or an escaped newline. We have to use the JSON parser to get a newline character.
      run: echo "result=${{ hashFiles(join(fromJson(env.LFS_FILES), fromJson('"\n"'))) }}" | tee -a "$GITHUB_OUTPUT"
      
    - name: Cache git lfs
      id: lfs-cache
      uses: actions/cache@v4
      with:
        path: .git/lfs
        # The files targeted with git lfs
        key: ekrano-lfs-${{ steps.calc-hash.outputs.result }}
        restore-keys: ekrano-lfs-
        enableCrossOsArchive: true

    - name: Fetch lfs data
      if: ${{ steps.lfs-cache.outputs.cache-hit != 'true' }}
      run: git lfs fetch --include '${{ join(fromJson(env.LFS_FILES), ',') }}'
  
  test-stable:
    name: cargo test
    needs: prime-lfs-cache
    # Passing ubuntu cargo test jobs (n=80): mean 6.4m, σ 2.1m, μ+2σ 10.6m, max 18.8m.
    # Windows DX12/WARP is slower (compile + serialized binaries); give it more headroom.
    timeout-minutes: ${{ matrix.timeout }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: lavapipe (software Vulkan) on free ubuntu-24.04 runners.
          # Requires Mesa 25.0+ via ci/setup-ubuntu.sh for Vulkan 1.4.
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            gpu: 'yes'
            timeout: 11
          - os: macos-latest
            runner: macos-latest
            gpu: 'yes'
            timeout: 11
          - os: windows-latest
            runner: windows-latest
            gpu: 'yes'
            timeout: 30
    steps:
      - uses: actions/checkout@v4
        # We intentionally do not use lfs: true here, instead using the caching method to save LFS bandwidth.

      - name: Clone goldy
        run: git clone --depth 1 --branch ${{ env.GOLDY_BRANCH }} ${{ env.GOLDY_REPO }} ../goldy

      - name: Restore lfs cache
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          # The files targeted with git lfs
          key: ekrano-lfs-${{ needs.prime-lfs-cache.outputs.lfs-hash }}
          enableCrossOsArchive: true

      - name: Install Git LFS
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install --local
  
      - name: Checkout LFS files
        # `git lfs checkout` requires that each individual glob is a separate command line argument.
        # The string `''' '''` is how you write `' '` in GitHub's expression context (i.e. two quotes separated by a space)
        # The quotes are to avoid the shell from evaluating the globs itself.
        run: git lfs checkout '${{ join(fromJson(env.LFS_FILES), ''' ''') }}'
        continue-on-error: true

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}

      # Shared script: installs Vulkan tooling and build dependencies.
      # Also used by ci/Dockerfile for local reproduction.
      - name: Install Vulkan dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: bash ci/setup-ubuntu.sh

      - name: Verify lavapipe
        if: matrix.os == 'ubuntu-24.04'
        run: |
          if [ -z "${LAVAPIPE_ICD:-}" ]; then
            echo "ERROR: LAVAPIPE_ICD not set by ci/setup-ubuntu.sh" >&2
            exit 1
          fi
          echo "Using lavapipe ICD: $LAVAPIPE_ICD"
          VK_ICD_FILENAMES="$LAVAPIPE_ICD" vulkaninfo --summary
          VK_ICD_FILENAMES="$LAVAPIPE_ICD" vulkaninfo --summary | grep -Ei 'deviceName.*(llvmpipe|lavapipe)'

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      # Same as goldy CI: DX12 + Slang need DXC from the Windows SDK on PATH.
      - name: Add Windows SDK DXC to PATH
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64' -Directory |
                    Sort-Object Name | Select-Object -Last 1
          if ($sdkBin -and (Test-Path "$($sdkBin.FullName)\dxcompiler.dll")) {
            Write-Host "Found DXC at: $($sdkBin.FullName)"
            "$($sdkBin.FullName)" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          } else {
            Write-Host "WARNING: dxcompiler.dll not found in Windows SDK"
          }

      - name: Configure Goldy DX12 WARP (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "GOLDY_DX12_FORCE_WARP=1" >> "$GITHUB_ENV"
          echo "GOLDY_DX12_NO_DEBUG=1" >> "$GITHUB_ENV"

      # Install redistributable WARP next to the test binaries. Without this,
      # windows-latest uses the OS d3d10warp.dll (older Windows Server build),
      # which has compute-shader codegen bugs that corrupt the snapshot_many_clips
      # render. d3d12.dll probes the EXE directory for d3d10warp.dll before
      # falling back to System32, so dropping it in target\debug\deps\ and
      # target\debug\ takes precedence for cargo test binaries.
      - name: Install redistributable WARP (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ env.WARP_NUGET_VERSION }}"
          $workDir = "$env:RUNNER_TEMP\warp-nuget"
          # A .nupkg is just a zip. Download and expand without requiring nuget.exe.
          # Expand-Archive is strict about the .zip extension, so save it as .zip.
          $nupkg   = Join-Path $workDir "Microsoft.Direct3D.WARP.$version.zip"
          $extract = Join-Path $workDir "extract"
          $url     = "https://www.nuget.org/api/v2/package/Microsoft.Direct3D.WARP/$version"
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $nupkg -UseBasicParsing
          Expand-Archive -Path $nupkg -DestinationPath $extract -Force
          $warpDll = Get-ChildItem -Path $extract -Filter d3d10warp.dll -Recurse |
                     Where-Object { $_.FullName -like '*\x64\*' } |
                     Select-Object -First 1
          if (-not $warpDll) {
            Write-Host "ERROR: d3d10warp.dll not found under $extract"
            Get-ChildItem $extract -Recurse | Select-Object -ExpandProperty FullName
            exit 1
          }
          Write-Host "Using WARP $($warpDll.VersionInfo.FileVersion) from: $($warpDll.FullName)"
          New-Item -ItemType Directory -Force -Path target\debug\deps | Out-Null
          New-Item -ItemType Directory -Force -Path target\debug       | Out-Null
          Copy-Item $warpDll.FullName target\debug\deps\d3d10warp.dll -Force
          Copy-Item $warpDll.FullName target\debug\d3d10warp.dll      -Force
          "WARP_DLL=$($warpDll.FullName)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: cargo test
        if: matrix.os != 'windows-latest'
        # TODO: Maybe use --release; the CPU shaders are extremely slow when unoptimised
        # One process per test binary enables process-lifetime shared Device + WARP mutex.
        run: cargo test --workspace --locked --all-features --no-fail-fast
        env:
          EKRANO_CI_GPU_SUPPORT: ${{ matrix.gpu }}
          # Skip tests that are too slow on software-emulated GPUs (lavapipe, WARP).
          # These still run locally on real hardware.
          EKRANO_CI_SKIP_SLOW: 'yes'
          # Linux: force lavapipe ICD (set by ci/setup-ubuntu.sh). Empty on macOS/Windows.
          VK_ICD_FILENAMES: ${{ env.LAVAPIPE_ICD }}
          VK_LAYER_PATH: ""
          # We are experimenting with git lfs, and we don't expect to run out of bandwidth.
          # However, if we do, the tests are designed to be robust against that, if this environment variable is set.
          # If we do run out of bandwidth, uncomment the following line.
          # EKRANO_SKIP_LFS_SNAPSHOTS: all

      # DX12-only: avoid compiling Vulkan/Metal on the Windows runner.
      # `-j 1` serializes test binaries; WARP is not stable across concurrent processes
      # (in-process WARP mutex cannot help).
      - name: cargo test (Windows / DX12-only Goldy)
        if: matrix.os == 'windows-latest'
        run: >-
          cargo test --workspace --locked
          --no-default-features
          -F goldy-dx12-only -F bump_estimate -F tracy
          --no-fail-fast -j 1
        env:
          EKRANO_CI_GPU_SUPPORT: ${{ matrix.gpu }}
          EKRANO_CI_SKIP_SLOW: 'yes'
          GOLDY_BACKEND: dx12
          VK_LAYER_PATH: ""
          # DX12 WARP vs lavapipe/Metal snapshot refs. Skip CI-only (not local).
          EKRANO_CI_SKIP_SNAPSHOTS: 'glyphs_decoration_offset_values,glyphs_decoration_size_values,glyphs_decoration_no_descenders,scaled_hinted,two_emoji,splash,fill_types,luminance_mask'
      
      - name: Upload test results due to failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ekrano-snapshot-tests-${{ matrix.os }}
          path: |
            ekrano_tests/current

      - name: cargo test --doc
        if: matrix.os != 'windows-latest'
        run: cargo test --doc --workspace --locked --all-features --no-fail-fast

      - name: cargo test --doc (Windows / DX12-only Goldy)
        if: matrix.os == 'windows-latest'
        run: >-
          cargo test --doc --workspace --locked
          --no-default-features
          -F goldy-dx12-only -F bump_estimate -F tracy
          --no-fail-fast

  check-msrv:
    name: cargo check (msrv)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Clone goldy
        run: git clone --depth 1 --branch ${{ env.GOLDY_BRANCH }} ${{ env.GOLDY_REPO }} ../goldy

      - name: install msrv toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MIN_VER }}

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: cargo check
        run: cargo check ${{ env.RUST_MIN_VER_PKGS }} --locked --all-features

  doc:
    name: cargo doc
    # NOTE: We don't have any platform specific docs in this workspace, so we only run on Ubuntu.
    #       If we get per-platform docs (win/macos/linux/wasm32/..) then doc jobs should match that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone goldy
        run: git clone --depth 1 --branch ${{ env.GOLDY_BRANCH }} ${{ env.GOLDY_REPO }} ../goldy

      - name: install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      # We test documentation using nightly to match docs.rs.
      - name: cargo doc
        run: cargo doc --workspace --locked --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: '--cfg docsrs -D warnings'

  # If this fails, consider changing your text or adding something to .typos.toml.
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check typos
        uses: crate-ci/typos@v1.40.0
